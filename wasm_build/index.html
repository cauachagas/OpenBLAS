<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBLAS CBLAS Test - WebAssembly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            font-weight: 300;
        }
        
        .status-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }
        
        .status-box p {
            color: #333;
            margin: 5px 0;
        }
        
        .status-box.loading {
            border-left-color: #ffa500;
            background: #fff8f0;
        }
        
        .status-box.error {
            border-left-color: #ff6b6b;
            background: #ffe0e0;
        }
        
        .status-box.success {
            border-left-color: #51cf66;
            background: #e6ffe6;
        }
        
        .tests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .test-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .test-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .level-badge {
            display: inline-block;
            font-size: 0.7em;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .level1 .level-badge { background: #d0f0e0; color: #1a7a4a; }
        .level2 .level-badge { background: #d0e8ff; color: #1a4a9a; }
        .level3 .level-badge { background: #ead0ff; color: #5a1a9a; }
        .level1 { border-top: 3px solid #51cf66; }
        .level2 { border-top: 3px solid #339af0; }
        .level3 { border-top: 3px solid #9b59b6; }
        .complex1 .level-badge { background: #fff0cc; color: #7a5200; }
        .complex2 .level-badge { background: #ffe8cc; color: #7a3200; }
        .complex3 .level-badge { background: #ffd6b3; color: #7a2000; }
        .complex1 { border-top: 3px solid #f9a825; }
        .complex2 { border-top: 3px solid #ef6c00; }
        .complex3 { border-top: 3px solid #d84315; }
        
        .test-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .test-card p {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .test-card .result {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #333;
            min-height: 40px;
            display: flex;
            align-items: center;
        }
        
        .test-card .result.pending {
            color: #999;
            font-style: italic;
        }
        
        .test-card .result.error {
            color: #ff6b6b;
            background: #ffe0e0;
        }
        
        .test-card .result.success {
            color: #51cf66;
            background: #e6ffe6;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .console {
            background: #1e1e1e;
            color: #0fd000;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 30px;
        }
        
        .console p {
            margin: 5px 0;
            line-height: 1.4;
        }
        
        .console .info { color: #0fd000; }
        .console .warn { color: #ffaa00; }
        .console .error { color: #ff6b6b; }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 0.9em;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 OpenBLAS CBLAS Test</h1>
            <p class="subtitle">Running BLAS operations via WebAssembly</p>
        </header>
        
        <div class="status-box loading" id="status">
            <p>🔄 Initializing WebAssembly module...</p>
        </div>
        
        <div class="button-group">
            <button onclick="runAllTests()" id="runBtn" disabled>Run All Tests</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        
        <div class="tests-grid" id="tests-grid"></div>
        
        <div class="console" id="console"></div>
        
        <footer>
            <p>Built with Emscripten | WebAssembly CBLAS Interface</p>
        </footer>
    </div>
    
    <script type="module" src="./index-page.js"></script>
</body>
</html>
