name: Publish WebAssembly Pages

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/wasm-pages.yml
      - wasm/**
      - cblas.h
      - common.h
      - config.h
      - Makefile
      - Makefile.*

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasm-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebAssembly bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Verify toolchain
        run: |
          emcc --version
          make --version

      - name: Build OpenBLAS static library for WASM
        run: bash wasm/scripts/build_openblas.sh

      - name: Build WebAssembly distribution bundle
        run: make -C wasm dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm/dist

  deploy:
    name: Deploy WebAssembly Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4