name: Publish WebAssembly Pages

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/wasm-pages.yml
      - wasm_build/**
      - cblas.h
      - common.h
      - config.h
      - Makefile
      - Makefile.*
      - wasm_build/build_openblas_wasm.sh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasm-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebAssembly bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Verify toolchain
        run: |
          emcc --version
          make --version

      - name: Build OpenBLAS static library for WASM
        run: bash wasm_build/build_openblas_wasm.sh

      - name: Build browser bundle
        run: make -C wasm_build wasm

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp wasm_build/index.html pages-dist/
          cp wasm_build/interactive_inputs.html pages-dist/
          cp wasm_build/index-page.js pages-dist/
          cp wasm_build/interactive_inputs.js pages-dist/
          cp wasm_build/openblas-loader.js pages-dist/
          cp wasm_build/test.mjs pages-dist/
          cp wasm_build/test.wasm pages-dist/
          touch pages-dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    name: Deploy WebAssembly Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4